<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan TKA Bahasa Indonesia</title>
<style>
:root{--bg:#fbf6f9;--card:#fff;--rose:#b24f6c;--rose2:#8e3a5a;--blush:#f6dde6;--ink:#3b1f33;--mut:#7d6173;--line:#ead6df;--ok:#2c8a57;--okbg:#e6f5ec;--no:#c23a56;--nobg:#fdebee;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.w{max-width:740px;margin:0 auto;padding:16px 14px 60px}
h1,h2,h3,.ser{font-family:Georgia,Palatino,"Times New Roman",serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px}
button:focus-visible,input:focus-visible+b,summary:focus-visible{outline:3px solid #e9a3b8;outline-offset:2px}
button.pri{background:var(--rose);border-color:var(--rose);color:#fff}
button.pri:hover{background:var(--rose2)}
button:disabled{opacity:.45;cursor:default}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:56px 24px 48px;text-align:center;color:#fff;background:linear-gradient(160deg,#c4607d 0%,#8e3a5a 100%)}
.hero h1{position:relative;margin:0 auto;max-width:30ch;font-size:clamp(24px,5.6vw,34px);line-height:1.4;font-weight:400;font-style:italic}
.hero .h{position:absolute;bottom:-30px;opacity:0;font-size:22px;animation:fl 9s linear infinite}
@keyframes fl{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-420px) translateX(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero .h{animation:none;opacity:.5;bottom:auto;top:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.sts div{background:var(--blush);border-radius:14px;padding:12px 6px}
.sts b{display:block;font:700 28px/1.2 Georgia,serif;color:var(--rose2)}
.sts span{font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--blush);border-radius:99px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .3s}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.acts .pri{flex:1 1 200px;padding:13px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.top span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.grid button{padding:6px 0;border-radius:10px;font-size:14px}
.grid .dn{background:var(--blush);border-color:#e3b8c8}
.grid .cur{background:var(--rose);border-color:var(--rose);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{font-size:13px;padding:3px 12px;border-radius:99px;background:var(--rose);color:#fff}
.tag.s{background:var(--blush);color:var(--rose2)}
.pass{background:#fdf3f7;border-left:4px solid #e0a3b7;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-family:Georgia,serif;line-height:1.75}
.pass h3{margin:0 0 8px;font-size:18px}
.pass p{margin:0 0 10px}.pass p:last-child{margin:0}
.pass .poem,.pass .nt{font-style:italic}
.q p{margin:0 0 8px}
.hint{font-size:13px;color:var(--mut);margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#d99ab0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #d3a5b6;display:grid;place-items:center;font-size:14px;color:var(--rose2)}
.opt.on{border-color:var(--rose);background:#fdf0f4}
.opt.on b{background:var(--rose);border-color:var(--rose);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.opt span{flex:1}
table.bs{width:100%;border-collapse:collapse;margin-top:6px}
.bs th{font-size:14px;padding:6px;text-align:center;width:64px}
.bs th:first-child{width:auto}
.bs td{border-top:1px solid var(--line);padding:10px 6px;vertical-align:middle}
.bs td.c{text-align:center}
.bs input{width:20px;height:20px;accent-color:var(--rose)}
.bs tr.ok td:first-child{background:var(--okbg)}
.bs tr.no td:first-child{background:var(--nobg)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav .pri{flex:1}
.sv{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0}
.score{text-align:center}
.score .n{font:700 76px/1 Georgia,serif;color:var(--rose2)}
.pem{margin-top:14px;border-radius:12px;background:var(--okbg);padding:12px 16px;font-size:15px}
.pem p{margin:6px 0}
.pem.x{background:var(--nobg)}
details{margin-bottom:12px}
summary{cursor:pointer;color:var(--rose2);font-size:14px;margin-bottom:8px}
.rv h2{font-size:19px;margin:0 0 10px}
.mini{font-size:13px;color:var(--mut)}
</style>
</head>

<script>
const PS={
pasar:{t:"Peta Suara Pasar Lama",p:["Sekelompok siswa membuat proyek dokumentasi tentang sebuah pasar lama di kotanya. Mereka merekam suara pedagang, percakapan pembeli, dan bunyi aktivitas di sekitar pasar. Rekaman tersebut kemudian disusun menjadi podcast yang menceritakan perubahan pasar dari masa ke masa.","Agar mudah dipahami pendengar, setiap episode dilengkapi narasi singkat mengenai lokasi dan sejarah suara yang direkam. Tim juga menggunakan platform digital sekolah untuk menyimpan rekaman dan membagikannya kepada masyarakat. Menurut mereka, dokumentasi semacam ini dapat menjadi arsip yang menunjukkan bahwa suasana sebuah tempat tidak hanya dapat dikenali melalui gambar."]},
loker:{t:"Loker Berbagi Peralatan",p:["Sebuah sekolah membuka Loker Berbagi Peralatan, yaitu tempat siswa dapat meminjam benda yang jarang digunakan tetapi dibutuhkan untuk kegiatan tertentu. Peralatan yang tersedia antara lain kamera, tripod, alat ukur sederhana, dan perlengkapan berkemah.","Program tersebut dibuat agar siswa tidak perlu membeli peralatan yang hanya digunakan sesekali. Setiap siswa yang meminjam harus mencatat barang yang diambil dan mengembalikannya sesuai jadwal. Jika terdapat kerusakan akibat penggunaan, siswa diminta melaporkannya kepada pengelola loker.","Pada tahap awal, pengelola menyediakan 30 jenis peralatan. Setelah tiga bulan, sebagian besar peralatan telah digunakan untuk kegiatan proyek kelas dan organisasi siswa."]},
pulih:{t:"Ketika Barang Bekas Tidak Lagi Menunggu",p:["Di sebuah sekolah, ruang penyimpanan yang sebelumnya dipenuhi barang rusak mulai diubah menjadi Ruang Pulih. Tempat tersebut digunakan untuk memilah benda yang masih mungkin diperbaiki sebelum sekolah memutuskan untuk membuangnya. Kursi dengan sambungan longgar, papan pajangan yang terlepas, serta beberapa kotak penyimpanan menjadi benda yang pertama kali diperiksa.","Program ini tidak menyerahkan seluruh pekerjaan kepada petugas sekolah. Siswa yang tergabung dalam klub keterampilan membantu memperbaiki benda-benda sederhana, sedangkan benda yang membutuhkan keahlian khusus ditangani oleh teknisi. Setiap benda yang selesai diperbaiki diberi tanda tanggal agar pengelola dapat mengetahui berapa lama benda tersebut kembali digunakan.","Setelah berjalan satu semester, pengelola mencatat bahwa beberapa ruang kelas tidak lagi mengajukan permintaan pengadaan kursi baru. Namun, sekolah tetap melakukan pengadaan untuk benda yang memang sudah tidak layak digunakan."]},
jendela:{t:"Jendela yang Tidak Pernah Benar-Benar Tertutup",p:["Menjelang sore, suara pengumuman dari pengeras suara stasiun masih terdengar dari balik deretan rumah. Raka menutup jendela kamarnya, tetapi beberapa detik kemudian membukanya kembali. Udara di dalam ruangan terasa lebih pengap daripada udara di luar.","Sejak jalur kereta baru beroperasi, warga di gang itu mulai terbiasa dengan suara kereta yang datang dan pergi. Sebagian memasang kaca tambahan pada jendela, sementara sebagian lain memilih menyesuaikan jam istirahat dengan jadwal kereta malam.","Raka sendiri tidak terlalu terganggu oleh suara tersebut. Ia justru sering duduk di teras ketika kereta terakhir melintas. Baginya, suara yang dahulu terasa asing kini menjadi penanda bahwa malam telah dimulai."]},
trad:{t:"Menghidupkan Kembali Pasar Tradisional",p:["Pasar tradisional tidak hanya menjadi tempat berlangsungnya kegiatan jual beli, tetapi juga menjadi bagian dari kehidupan sosial masyarakat. Namun, perkembangan pusat perbelanjaan modern dan perubahan kebiasaan berbelanja membuat sebagian pasar tradisional mengalami penurunan jumlah pengunjung. Kondisi tersebut mendorong berbagai pihak mencari cara agar pasar tradisional tetap diminati.","Salah satu upaya yang dilakukan adalah memperbaiki fasilitas pasar. Area yang bersih, pencahayaan yang memadai, serta jalur yang tertata dapat membuat pengunjung merasa lebih nyaman. Selain itu, pengelola pasar dapat menyediakan fasilitas pendukung seperti tempat parkir dan area pengelolaan sampah yang lebih baik.","Perubahan juga diperlukan dalam cara pedagang melayani pembeli. Pedagang dapat menjaga kebersihan barang dagangan, memberikan informasi harga dengan jelas, serta menggunakan pembayaran digital apabila fasilitas tersebut tersedia. Langkah tersebut dapat membantu pasar tradisional menyesuaikan diri dengan kebiasaan konsumen yang semakin beragam.","Upaya menghidupkan kembali pasar tradisional tidak hanya menjadi tanggung jawab pengelola dan pedagang. Masyarakat sebagai konsumen juga memiliki peran dengan memilih berbelanja di pasar tradisional dan menjaga fasilitas yang tersedia. Dengan keterlibatan berbagai pihak, pasar tradisional dapat tetap memiliki tempat dalam kehidupan masyarakat di tengah perubahan pola konsumsi."]},
air:{t:"Kota yang Mulai Belajar Menyimpan Air",p:["Ketika hujan turun deras, beberapa kawasan permukiman di kota sering mengalami genangan meskipun hujan tidak berlangsung sepanjang hari. Selama ini, air hujan lebih banyak diarahkan secepat mungkin menuju saluran pembuangan. Cara tersebut memang membuat air segera meninggalkan permukaan jalan, tetapi ketika volume air terlalu besar, saluran tidak selalu mampu menampungnya.","Sejumlah warga kemudian mencoba pendekatan berbeda. Di beberapa halaman rumah, mereka membuat lubang biopori dan area tanah terbuka. Di ruang publik, sebagian permukaan yang sebelumnya tertutup beton diganti dengan material yang memungkinkan air meresap. Taman kecil juga tidak hanya ditanami tanaman, tetapi dirancang agar sebagian air hujan tertahan sebelum mengalir ke saluran.","Perubahan tersebut tidak langsung menghilangkan genangan. Namun, warga mulai melihat bahwa pengelolaan air hujan tidak harus selalu berarti membuangnya secepat mungkin. Air dapat diberi kesempatan untuk meresap atau ditahan sementara sehingga beban saluran berkurang.","Dengan demikian, persoalan genangan tidak hanya berkaitan dengan banyaknya hujan, tetapi juga dengan cara sebuah kawasan memperlakukan air yang datang. Kota yang semula berusaha secepat mungkin membuang air mulai belajar menyediakan ruang untuk menerimanya."]},
tas:{t:"Bukan Sekadar Memindahkan Barang",p:["Ketika sebuah pusat perbelanjaan mengganti kantong plastik sekali pakai dengan tas belanja yang dapat digunakan berulang kali, perubahan tersebut awalnya mendapat tanggapan positif. Konsumen melihat kebijakan itu sebagai langkah sederhana untuk mengurangi sampah plastik. Namun, setelah beberapa bulan, pengelola menemukan bahwa sebagian konsumen justru mengumpulkan tas belanja tersebut di rumah dan jarang menggunakannya kembali.","Temuan itu membuat pengelola mengubah cara kampanye dilakukan. Alih-alih hanya membagikan tas pengganti, mereka mulai mengingatkan konsumen untuk membawa kembali tas yang telah dimiliki. Beberapa toko juga menyediakan tempat penyimpanan sementara bagi konsumen yang datang tanpa membawa tas, sehingga tas yang sudah tersedia dapat digunakan kembali pada kunjungan berikutnya.","Perubahan strategi tersebut menunjukkan bahwa sebuah kebijakan lingkungan tidak selalu cukup hanya dengan mengganti benda yang digunakan. Kebiasaan orang dalam menggunakan benda tersebut juga menentukan apakah tujuan kebijakan benar-benar tercapai."]},
pustaka:{t:"Saat Perpustakaan Tidak Hanya Menyimpan Buku",p:["Sebuah perpustakaan sekolah menempatkan rak khusus berisi benda-benda yang dapat digunakan siswa untuk membuat proyek, seperti kaca pembesar, alat ukur sederhana, kamera, dan beberapa perangkat perekam suara. Benda-benda tersebut dapat dipinjam dengan prosedur yang sama seperti peminjaman buku.","Pada awalnya, pengelola memperkirakan bahwa peralatan tersebut akan paling banyak digunakan dalam pelajaran sains. Perkiraan itu ternyata tidak sepenuhnya tepat. Siswa dari kelas bahasa meminjam alat perekam untuk membuat dokumentasi wawancara, sedangkan kelompok seni menggunakannya untuk merekam suara sebagai bagian dari pertunjukan.","Pengalaman tersebut membuat pengelola memperluas daftar benda yang dapat dipinjam. Mereka tidak lagi mengelompokkan benda berdasarkan mata pelajaran tertentu, tetapi berdasarkan jenis kegiatan yang mungkin dilakukan siswa. Menurut pengelola, cara itu membuat siswa lebih mudah melihat bahwa satu benda dapat memiliki fungsi yang berbeda ketika digunakan dalam konteks yang berbeda."]},
rak:{t:"Satu Rak yang Selalu Berpindah",p:["Di sebuah ruang baca kampung, terdapat satu rak kecil yang sengaja tidak ditempatkan secara permanen. Setiap dua minggu, pengelola memindahkannya ke tempat yang berbeda: dekat pos ronda, di teras balai warga, atau di sudut lapangan yang teduh. Buku-buku di dalamnya boleh dibaca siapa saja tanpa harus dicatat sebagai peminjaman.","Pada awalnya, sebagian warga menganggap cara tersebut merepotkan karena mereka harus mencari tahu lokasi rak. Namun, pengelola mencatat bahwa setiap kali rak dipindahkan ke tempat yang lebih ramai, jumlah orang yang berhenti untuk membaca meningkat. Anak-anak biasanya mengambil buku cerita, sedangkan orang dewasa lebih sering membaca majalah dan buku praktis.","Setelah beberapa kali pemindahan, pengelola mulai melihat pola bahwa lokasi rak sangat memengaruhi jumlah pembaca. Mereka kemudian berencana mencatat jumlah pengunjung di setiap lokasi selama beberapa minggu berikutnya."]},
sungai:{t:"Ketika Sungai Menjadi Halaman Belakang",p:["Di sebuah kawasan padat penduduk, sungai kecil yang melewati permukiman selama bertahun-tahun dianggap sebagai bagian belakang rumah. Warga jarang menggunakannya sebagai ruang bersama. Setelah beberapa kali hujan deras menyebabkan air meluap, sekelompok warga mulai membersihkan bantaran sungai dan membuat jalur kecil untuk berjalan di sepanjang tepinya.","Pada awalnya, kegiatan tersebut hanya dilakukan beberapa orang. Namun, setelah warga memasang papan informasi tentang larangan membuang sampah dan menyediakan tempat duduk sederhana, anak-anak mulai menggunakan jalur itu untuk berjalan sore. Beberapa warga bahkan mengadakan kegiatan membersihkan sungai secara berkala.","Perubahan tersebut tidak serta-merta menyelesaikan persoalan banjir. Akan tetapi, cara warga memandang sungai mulai berubah. Sungai yang sebelumnya dianggap sebagai bagian belakang kawasan perlahan dipandang sebagai ruang yang perlu dirawat bersama."]},
data:{t:"Ketika Data Kota Tidak Berhenti di Angka",p:["Sebuah pemerintah kota memasang sensor kualitas udara di sejumlah titik yang memiliki aktivitas kendaraan tinggi. Data dari sensor tersebut diperbarui secara berkala dan ditampilkan melalui laman publik. Langkah itu diharapkan membantu masyarakat mengetahui kondisi udara di lingkungan mereka.","Namun, peneliti dari sebuah perguruan tinggi mengingatkan bahwa data dari sensor tidak dapat langsung dianggap sebagai gambaran kondisi seluruh kota. Titik pemasangan sensor, kondisi cuaca, waktu pengukuran, dan gangguan teknis dapat memengaruhi hasil pembacaan. Karena itu, data perlu dibaca bersama informasi pendukung sebelum digunakan untuk menarik kesimpulan.","Pemerintah kota kemudian berencana menambahkan keterangan mengenai lokasi sensor, waktu pengukuran, serta kondisi ketika data tidak dapat direkam. Menurut pengelola, informasi tersebut diperlukan agar masyarakat tidak hanya melihat angka, tetapi juga memahami konteks di balik angka tersebut."]},
peta:{t:"Peta yang Dibuat dari Suara Warga",p:["Sebuah komunitas di sebuah kota mengembangkan peta digital yang memuat titik-titik fasilitas publik yang dianggap penting oleh warga, seperti halte, ruang terbuka, tempat pengisian air minum, dan jalur yang aman bagi pejalan kaki. Berbeda dari peta konvensional, informasi tersebut dikumpulkan melalui laporan masyarakat yang kemudian diverifikasi oleh relawan.","Pengelola menyatakan bahwa pendekatan tersebut membuat peta lebih representatif, karena informasi yang ditampilkan berasal dari pengalaman warga yang menggunakan fasilitas tersebut secara langsung. Meski demikian, pengelola tetap melakukan pemeriksaan agar informasi yang belum terverifikasi tidak segera ditampilkan kepada publik."]},
rong:{t:"Kutipan novel Ronggeng Dukuh Paruk — Ahmad Tohari",p:["“Dukuh Paruk kecil itu telah kembali kepada sunyi. Ketika matahari mulai condong ke barat, anak-anak yang bermain di halaman rumah telah dipanggil pulang oleh ibu mereka. Suara lesung yang biasanya terdengar dari kejauhan pun telah berhenti. Hanya suara burung yang sesekali terdengar dari pepohonan.”"],n:"(Kutipan disajikan sebagai bagian pendek untuk kepentingan pembelajaran.)"},
dara:{p:["Sejak pukul lima pagi, Dara sudah berada di belakang rumah. Ia menata pot-pot kecil berisi bibit tanaman yang semalam dipindahkannya dari kebun warga. Udara masih menyimpan bau tanah basah ketika suara mesin perahu mulai terdengar dari sungai.","“Kalau sungai ini terus dipenuhi sampah, nanti siapa yang masih mau menanam di sini?” gumamnya.","Dara mengambil karung bekas dan berjalan menyusuri tepian sungai. Ia tidak menunggu teman-temannya datang. Setiap kali menemukan botol plastik atau bungkus makanan, ia memungutnya dan memasukkannya ke dalam karung. Tangannya beberapa kali terkena lumpur, tetapi ia hanya mengusapnya pada celana lalu melanjutkan pekerjaan.","Menjelang siang, beberapa anak sekolah yang melihat Dara mulai ikut membantu. Mereka mengumpulkan sampah di sepanjang tepian, sementara Dara menunjukkan bagian sungai yang alirannya tersumbat. Setelah pekerjaan selesai, Dara berdiri di jembatan kayu. Dari sana, ia melihat air sungai mengalir lebih lancar meskipun masih keruh.","“Belum bersih,” katanya kepada anak-anak itu, “tetapi setidaknya hari ini kita tidak membiarkannya semakin buruk.”"]},
puisi:{p:["Perhatikan kutipan puisi “Senja di Pelabuhan Kecil” karya Chairil Anwar berikut."],v:["Ini kali tidak ada yang mencari cinta","di antara gudang, rumah tua, pada cerita","tiang serta temali."]}
};

const Q=[
pg("pasar","Kata serapan yang digunakan dalam bidang teknologi dan media digital pada teks tersebut adalah ....",["pasar dan pembeli","suara dan rekaman","narasi dan sejarah","podcast dan platform","lokasi dan masyarakat"],3,"Kata podcast dan platform merupakan kata serapan yang digunakan dalam konteks teknologi dan media digital. Keduanya berkaitan langsung dengan bentuk media dan sarana yang digunakan untuk menyebarkan konten digital. Sementara itu, pilihan lainnya tidak menunjukkan penggunaan kata serapan dalam bidang tersebut."),
pk("pasar","Berdasarkan teks “Peta Suara Pasar Lama”, kata-kata berikut yang merupakan kata serapan dari bahasa asing adalah ....\nPilih semua jawaban yang tepat.",["podcast","platform","narasi","arsip","pembeli"],[0,1,2,3],"Kata podcast, platform, narasi, dan arsip merupakan kata yang berasal dari bahasa asing dan telah digunakan dalam bahasa Indonesia. Keempatnya muncul dalam teks untuk mendukung Pembahasan mengenai dokumentasi, media, dan penyimpanan informasi. Kata pembeli merupakan kata yang terbentuk dari kata dasar beli dengan imbuhan, bukan kata serapan."),
pg("loker","Apa tujuan utama dibuatnya Loker Berbagi Peralatan berdasarkan teks?",["Mengurangi kebutuhan membeli peralatan yang hanya digunakan sesekali","Menyediakan peralatan baru untuk setiap kegiatan sekolah","Menjual peralatan kepada siswa dengan harga murah","Menggantikan seluruh kegiatan praktik dengan kegiatan organisasi","Membatasi penggunaan peralatan oleh siswa"],0,"Tujuan program disebutkan secara langsung dalam paragraf kedua, yaitu agar siswa tidak perlu membeli peralatan yang hanya digunakan sesekali. Jadi, program tersebut dibuat untuk memanfaatkan peralatan secara bersama dan mengurangi kebutuhan membeli barang yang jarang digunakan."),
bs("loker","Berdasarkan teks “Loker Berbagi Peralatan”, tentukan apakah setiap pernyataan berikut Benar atau Salah dengan informasi yang terdapat dalam teks.",["Siswa dapat meminjam kamera dari Loker Berbagi Peralatan.","Siswa wajib membeli peralatan sebelum dapat meminjamnya.","Peminjam harus mengembalikan peralatan sesuai jadwal.","Pada tahap awal, tersedia 30 jenis peralatan."],[1,0,1,1],"Semua jawaban dapat ditemukan secara langsung dalam teks. Kamera termasuk peralatan yang tersedia, peminjam justru tidak perlu membeli barang, pengembalian dilakukan sesuai jadwal, dan jumlah awal peralatan disebutkan sebanyak 30 jenis. Karena informasinya tertulis secara jelas, soal ini menguji kemampuan menemukan informasi tersurat, bukan membuat kesimpulan dari teks."),
pk("pulih","Pilih semua pernyataan yang informasinya dinyatakan secara tersurat dalam teks.",["Seluruh barang yang rusak diperbaiki oleh siswa dari klub keterampilan.","Ruang Pulih dibentuk dengan memanfaatkan ruang penyimpanan yang sebelumnya dipenuhi barang rusak.","Setelah satu semester, sekolah tidak lagi melakukan pengadaan kursi baru.","Benda yang memerlukan keahlian khusus diperbaiki oleh teknisi.","Setiap benda yang selesai diperbaiki diberi tanda tanggal."],[1,3,4],"Pernyataan B, D, dan E sesuai dengan informasi yang tertulis langsung dalam teks. Pernyataan A keliru karena benda yang membutuhkan keahlian khusus ditangani teknisi, bukan seluruhnya oleh siswa. Pernyataan C juga tidak tepat karena teks hanya menyebutkan beberapa ruang kelas tidak lagi mengajukan pengadaan kursi baru, sementara pengadaan tetap dilakukan untuk benda yang sudah tidak layak digunakan."),
pg("jendela","Berdasarkan penggunaan kosakata dan situasi dalam teks, latar tempat yang paling kuat ditunjukkan oleh cerita adalah ....",["lingkungan sekolah yang berdekatan dengan stasiun","kawasan pertokoan yang berada di pusat kota","perkampungan yang jauh dari aktivitas transportasi","kompleks perumahan yang berada di sekitar terminal bus","permukiman yang berada di sekitar jalur kereta api"],4,"Latar tempat dapat dikenali dari kosakata seperti “pengeras suara stasiun”, “jalur kereta”, “suara kereta”, “gang”, dan “kereta terakhir melintas”. Rangkaian petunjuk tersebut menunjukkan bahwa tokoh tinggal di permukiman yang berada di sekitar jalur kereta api. Pilihan lain tidak didukung oleh situasi dalam teks."),
pg("jendela","Mengacu pada teks “Jendela yang Tidak Pernah Benar-Benar Tertutup”\nPerubahan sikap Raka terhadap suara kereta paling tepat menunjukkan karakter Raka sebagai tokoh yang ....",["mudah menyerah ketika menghadapi keadaan yang tidak sesuai keinginannya","cenderung menghindari lingkungan yang dianggap mengganggu kenyamanannya","mampu beradaptasi hingga sesuatu yang awalnya asing menjadi bagian dari kesehariannya","selalu menganggap perubahan lingkungan sebagai sesuatu yang menyenangkan","tidak peduli terhadap perubahan yang terjadi di lingkungan tempat tinggalnya"],2,"Pada awalnya, suara kereta merupakan sesuatu yang asing bagi warga. Namun, Raka kemudian tidak lagi terlalu terganggu dan bahkan menjadikan suara kereta sebagai penanda dimulainya malam. Perubahan tersebut menunjukkan bahwa Raka mampu beradaptasi dengan kondisi lingkungannya. Pilihan lain tidak sesuai dengan sikap Raka yang digambarkan dalam teks."),
pk("jendela","Berdasarkan teks “Jendela yang Tidak Pernah Benar-Benar Tertutup”, pernyataan yang tepat untuk menggambarkan fenomena dan kondisi tokoh dalam cerita adalah ....\nPilih semua jawaban yang tepat.",["Seluruh warga menganggap suara kereta sebagai gangguan yang harus dihilangkan.","Pengoperasian jalur kereta menyebabkan warga meninggalkan lingkungan tempat tinggal mereka.","Kehadiran jalur kereta memengaruhi kebiasaan warga di lingkungan tersebut.","Sebagian warga melakukan penyesuaian fisik maupun kebiasaan untuk menghadapi perubahan lingkungan.","Raka menunjukkan bahwa seseorang dapat membangun kebiasaan baru terhadap kondisi yang semula terasa asing."],[2,3,4],"Fenomena yang tampak dalam teks adalah perubahan lingkungan akibat beroperasinya jalur kereta dan penyesuaian warga terhadap perubahan tersebut. Hal itu terlihat dari penggunaan kaca tambahan dan penyesuaian jam istirahat. Raka juga menunjukkan bentuk adaptasi pribadi karena suara kereta yang awalnya asing kemudian menjadi bagian dari kesehariannya. Sementara itu, tidak ada informasi bahwa seluruh warga merasa terganggu atau meninggalkan tempat tinggal mereka."),
pg("trad","Kerangka yang paling sesuai dengan isi teks tersebut adalah ....",["Pengertian pasar tradisional\n→ Jenis pusat perbelanjaan modern\n→ Fasilitas pasar tradisional\n→ Sistem pembayaran digital\n→ Perubahan kebiasaan masyarakat dalam berbelanja","Penurunan minat terhadap pasar tradisional\n→ Perbaikan fasilitas pasar\n→ Penyesuaian pelayanan pedagang\n→ Peran masyarakat\n→ Pentingnya keterlibatan berbagai pihak dalam mempertahankan pasar tradisional","Perkembangan pusat perbelanjaan modern\n→ Kondisi pasar tradisional\n→ Fasilitas tempat parkir\n→ Kebersihan barang dagangan\n→ Masyarakat sebagai konsumen","Pasar tradisional sebagai tempat jual beli\n→ Pedagang menggunakan pembayaran digital\n→ Pengelola menyediakan tempat parkir\n→ Masyarakat berbelanja di pasar\n→ Pasar tradisional menjadi pusat perbelanjaan modern","Masalah pasar tradisional\n→ Peran pengelola dalam menyediakan fasilitas\n→ Peran pedagang dalam meningkatkan pelayanan\n→ Peran konsumen dalam memilih pasar\n→ Pasar tradisional harus bersaing dengan pusat perbelanjaan modern"],1,"Kerangka teks harus memuat bagian-bagian utama yang mewakili keseluruhan isi teks dan disusun secara runtut.\nTeks diawali dengan masalah, yaitu menurunnya jumlah pengunjung pasar tradisional akibat perkembangan pusat perbelanjaan modern dan perubahan kebiasaan berbelanja. Selanjutnya, teks membahas dua bentuk upaya, yaitu perbaikan fasilitas pasar dan penyesuaian pelayanan pedagang. Pada bagian akhir dijelaskan peran masyarakat serta pentingnya keterlibatan berbagai pihak.\nSusunan tersebut terdapat secara lengkap dan berurutan pada pilihan B.\nPilihan lainnya lebih banyak memuat informasi rinci atau tidak menggambarkan alur Pembahasan teks secara utuh.\nJadi, jawaban yang tepat adalah B."),
bs("trad","Beberapa alternatif kerangka berikut dibuat berdasarkan teks “Menghidupkan Kembali Pasar Tradisional”.\nTentukan apakah setiap kerangka Benar atau Salah berdasarkan kesesuaiannya dengan bagian-bagian penting dalam teks.",["Masalah pasar tradisional → perbaikan fasilitas → penyesuaian pelayanan pedagang → peran masyarakat → keterlibatan berbagai pihak.","Masalah pasar tradisional → perkembangan pusat perbelanjaan modern → tempat parkir → pembayaran digital → kebiasaan konsumen.","Kondisi pasar tradisional → upaya pengelola → upaya pedagang → peran masyarakat → keberlanjutan pasar tradisional.","Pasar tradisional sebagai tempat jual beli → fasilitas pasar → jenis pembayaran → kebersihan barang → keputusan masyarakat berbelanja."],[1,0,1,0],"Kerangka yang benar harus mengambil gagasan utama dari setiap bagian teks, bukan sekadar mengumpulkan informasi yang disebutkan dalam bacaan.\n1. Benar.\nKerangka tersebut mencakup masalah yang dihadapi pasar tradisional, dua bentuk upaya perbaikan, peran masyarakat, dan simpulan mengenai keterlibatan berbagai pihak. Susunannya juga mengikuti alur Pembahasan teks.\n2. Salah.\nKerangka ini memasukkan beberapa informasi yang hanya bersifat pendukung, seperti tempat parkir dan pembayaran digital. Selain itu, peran masyarakat dan simpulan mengenai keterlibatan berbagai pihak tidak tercakup.\n3. Benar.\nKerangka ini mewakili alur utama teks: kondisi yang dihadapi pasar, upaya pengelola, upaya pedagang, peran masyarakat, kemudian tujuan akhirnya agar pasar tradisional tetap bertahan.\n4. Salah.\nKerangka ini terlalu berfokus pada rincian informasi, seperti jenis pembayaran dan kebersihan barang. Bagian tersebut tidak cukup mewakili keseluruhan gagasan teks dan tidak memuat gagasan penting mengenai masalah serta keterlibatan berbagai pihak."),
pg("air","Ide pokok yang paling tepat untuk teks tersebut adalah ....",["Saluran pembuangan tidak mampu menampung air hujan dalam semua kondisi.","Warga menggunakan berbagai tanaman untuk mengurangi genangan di permukiman.","Perubahan permukaan beton menjadi tanah terbuka merupakan cara utama mengatasi genangan.","Pengelolaan air hujan perlu mempertimbangkan upaya menahan dan meresapkan air, bukan hanya membuangnya.","Hujan deras menjadi penyebab utama terjadinya genangan di kawasan perkotaan."],3,"Teks tidak hanya membahas genangan atau biopori secara terpisah. Gagasan yang mengikat seluruh paragraf adalah perubahan cara mengelola air hujan, yaitu dari sekadar membuang air menuju upaya menahan dan meresapkannya. Berbagai contoh pada paragraf kedua berfungsi sebagai pendukung gagasan tersebut."),
pg("air","Pernyataan berikut yang paling tepat disimpulkan dari teks adalah ....",["Upaya mengurangi genangan akan berhasil apabila seluruh permukaan kota diubah menjadi tanah terbuka.","Pengelolaan genangan dapat dilakukan dengan mengatur bagaimana air hujan ditampung, dialirkan, dan diserap di suatu kawasan.","Warga seharusnya menghentikan penggunaan saluran pembuangan karena saluran tersebut memperparah genangan.","Penggantian beton dengan material berpori dapat menghilangkan genangan tanpa memerlukan tindakan lain.","Kota dengan curah hujan tinggi pasti mengalami masalah genangan meskipun memiliki sistem pengelolaan air yang baik."],1,"Kesimpulan pada pilihan B mencakup gagasan dari seluruh teks. Teks menunjukkan bahwa masalah genangan tidak hanya berkaitan dengan jumlah hujan, tetapi juga dengan cara air dikelola dalam suatu kawasan. Pilihan lainnya terlalu mutlak karena teks tidak pernah menyatakan bahwa satu cara saja dapat menghilangkan genangan atau bahwa saluran pembuangan harus dihentikan."),
bs("air","Berdasarkan teks “Kota yang Mulai Belajar Menyimpan Air”, tentukan apakah setiap simpulan berikut Benar atau Tidak Didukung oleh isi teks.",["Penanganan genangan dapat melibatkan perubahan desain ruang di suatu kawasan.","Masalah genangan sepenuhnya disebabkan oleh buruknya sistem saluran pembuangan.","Memberikan ruang bagi air untuk meresap dapat menjadi bagian dari strategi pengelolaan air hujan.","Pengelolaan air hujan dengan cara baru langsung menghilangkan seluruh genangan."],[1,0,1,0],"Simpulan nomor 1 didukung oleh perubahan halaman, ruang publik, dan permukaan beton yang disebutkan dalam teks. Nomor 3 juga sesuai karena teks menekankan pentingnya memberi kesempatan bagi air untuk meresap atau tertahan. Sebaliknya, teks tidak menyatakan bahwa genangan hanya disebabkan saluran pembuangan atau bahwa pendekatan baru langsung menghilangkan seluruh genangan. Bahkan, teks secara jelas menyebutkan bahwa perubahan tersebut tidak langsung menghilangkan genangan."),
pk("air","Pernyataan yang dapat disimpulkan secara logis dari teks “Kota yang Mulai Belajar Menyimpan Air” adalah ....\nPilih semua jawaban yang tepat.",["Cara suatu kota merancang ruang dapat memengaruhi bagaimana air hujan bergerak dan dikelola.","Penggunaan teknologi modern merupakan syarat utama agar sebuah kota mampu mengatasi genangan.","Penyelesaian persoalan genangan membutuhkan perhatian terhadap kondisi kawasan, bukan hanya terhadap intensitas hujan.","Upaya menahan air hujan dapat mengurangi beban yang harus ditanggung saluran pembuangan.","Perubahan dalam pengelolaan air hujan dapat dilakukan dengan menyediakan lebih banyak ruang bagi air untuk meresap atau tertahan."],[0,2,3,4],"Pilihan A, C, D, dan E dapat ditarik dari hubungan gagasan dalam teks. Teks menunjukkan bahwa bentuk ruang memengaruhi pengelolaan air, persoalan genangan tidak hanya berkaitan dengan hujan, dan air yang ditahan atau diresapkan dapat mengurangi beban saluran. Pilihan B tidak tepat karena teks tidak menjadikan teknologi modern sebagai syarat; contoh yang diberikan justru berupa perubahan sederhana pada ruang dan permukaan."),
pg("tas","Hubungan makna antara paragraf pertama dan paragraf kedua dalam teks tersebut adalah ....",["Paragraf kedua memberikan contoh tambahan yang tidak berkaitan dengan persoalan pada paragraf pertama.","Paragraf kedua menyimpulkan bahwa tas belanja yang dapat digunakan kembali tidak bermanfaat.","Paragraf kedua membantah bahwa konsumen memberikan tanggapan positif terhadap kebijakan tersebut.","Paragraf kedua menjelaskan penyebab pusat perbelanjaan mengganti kantong plastik.","Paragraf kedua menjelaskan respons pengelola terhadap masalah yang ditemukan pada paragraf pertama."],4,"Paragraf pertama memperlihatkan masalah yang ditemukan setelah kebijakan berjalan, yaitu sebagian konsumen tidak menggunakan kembali tas yang telah diberikan. Paragraf kedua kemudian menjelaskan perubahan strategi pengelola sebagai respons terhadap masalah tersebut. Jadi, hubungan kedua paragraf bersifat masalah dan respons terhadap masalah."),
pg("tas","Kalimat “Kebiasaan orang dalam menggunakan benda tersebut juga menentukan apakah tujuan kebijakan benar-benar tercapai” pada paragraf ketiga berfungsi untuk ....",["mempersempit Pembahasan hanya pada perilaku konsumen","memberikan data baru tentang jumlah tas yang dibagikan","menegaskan gagasan yang dapat disimpulkan dari persoalan dan perubahan strategi pada paragraf sebelumnya","menunjukkan bahwa pengelola gagal menerapkan kebijakan pengurangan sampah","membandingkan kebijakan pusat perbelanjaan dengan kebijakan lingkungan lainnya"],2,"Paragraf sebelumnya menunjukkan bahwa penggantian kantong saja belum tentu mengubah perilaku konsumen, sehingga pengelola mengubah strategi. Kalimat pada paragraf ketiga kemudian menegaskan makna yang lebih umum dari rangkaian tersebut: keberhasilan kebijakan juga bergantung pada kebiasaan pengguna. Karena itu, fungsinya adalah memperkuat simpulan dari Pembahasan sebelumnya."),
bs("pustaka","Berdasarkan teks “Saat Perpustakaan Tidak Hanya Menyimpan Buku”, tentukan apakah hubungan antargagasan berikut Benar atau Salah.",["Paragraf pertama memperkenalkan sistem peminjaman benda, sedangkan paragraf kedua menunjukkan penggunaan benda tersebut di luar perkiraan awal.","Paragraf kedua menjadi dasar bagi perubahan cara pengelola mengelompokkan benda pada paragraf ketiga.","Paragraf ketiga bertentangan dengan paragraf kedua karena pengelola kembali membatasi benda berdasarkan mata pelajaran.","Keseluruhan paragraf membentuk perkembangan gagasan dari penyediaan benda, penemuan fungsi yang beragam, hingga penyesuaian sistem pengelolaan."],[1,1,0,1],"Teks berkembang secara berurutan. Paragraf pertama memperkenalkan program peminjaman benda, paragraf kedua menunjukkan bahwa benda tersebut ternyata digunakan untuk berbagai kegiatan, lalu paragraf ketiga menjelaskan perubahan sistem pengelompokan sebagai respons terhadap temuan tersebut. Karena itu, hubungan nomor 1, 2, dan 4 tepat, sedangkan nomor 3 bertentangan dengan isi teks."),
pg("rak","Jika pola dalam teks terus berlanjut, kemungkinan langkah pengelola selanjutnya adalah ....",["menghentikan pemindahan rak karena lokasi tidak memengaruhi jumlah pembaca","mengganti seluruh buku dengan majalah karena lebih banyak dibaca orang dewasa","membatasi buku hanya untuk warga yang telah terdaftar sebagai anggota","menetapkan lokasi rak berdasarkan data kunjungan yang diperoleh dari beberapa tempat","memindahkan rak setiap hari agar semua warga mendapat kesempatan yang sama"],3,"Pengelola sudah menemukan bahwa lokasi rak berkaitan dengan jumlah pembaca dan berencana mengumpulkan data dari beberapa lokasi. Langkah yang paling logis setelah data terkumpul adalah menggunakan data tersebut untuk menentukan lokasi yang paling efektif. Pilihan lain tidak mengikuti perkembangan yang ditunjukkan dalam teks."),
pk("rak","Jika pengelola melanjutkan rencana pada akhir teks, pernyataan yang paling mungkin terjadi adalah ....\nPilih semua jawaban yang tepat.",["Pengelola membandingkan jumlah pembaca dari beberapa lokasi rak.","Pengelola dapat menemukan lokasi yang memiliki tingkat kunjungan lebih tinggi.","Data kunjungan dapat digunakan sebagai pertimbangan dalam menentukan lokasi rak berikutnya.","Pengelola langsung menyimpulkan bahwa semua warga lebih menyukai buku cerita.","Pemindahan rak dihentikan karena pengelola tidak lagi membutuhkan informasi tentang lokasi."],[0,1,2],"Pada akhir teks, pengelola berencana mencatat jumlah pengunjung di setiap lokasi. Karena itu, langkah yang logis adalah membandingkan data, melihat lokasi dengan kunjungan lebih tinggi, lalu menggunakan hasil tersebut sebagai pertimbangan. Pilihan D terlalu jauh karena data jumlah pengunjung tidak otomatis menunjukkan jenis buku yang paling disukai semua warga."),
pg("sungai","Peristiwa berikut yang paling relevan dengan fenomena dalam teks adalah ....",["masyarakat membangun kebiasaan merawat fasilitas umum setelah menyadari bahwa fasilitas tersebut digunakan bersama","warga suatu daerah mengubah lahan kosong menjadi tempat parkir pribadi","sebuah perusahaan mengganti seluruh peralatan kantor karena sudah berusia lama","siswa memilih belajar di rumah karena fasilitas sekolah kurang lengkap","pedagang memindahkan tokonya ke lokasi yang lebih ramai untuk meningkatkan penjualan"],0,"Peristiwa pada pilihan A memiliki pola yang paling mirip dengan teks, yaitu perubahan cara memandang ruang/fasilitas bersama yang kemudian mendorong munculnya kebiasaan merawatnya. Pilihan lainnya memang menggambarkan perubahan atau tindakan tertentu, tetapi tidak memiliki hubungan yang kuat dengan gagasan utama tentang kepedulian terhadap ruang bersama."),
pk("sungai","Perhatikan beberapa peristiwa berikut. Pilih semua peristiwa yang memiliki relevansi paling kuat dengan fenomena dalam teks “Ketika Sungai Menjadi Halaman Belakang”.",["Warga mengubah taman yang sebelumnya jarang digunakan menjadi ruang kegiatan bersama dan kemudian membuat jadwal perawatannya.","Sekelompok warga merawat halte lingkungan setelah menyadari bahwa fasilitas tersebut banyak digunakan oleh masyarakat sekitar.","Pengelola gedung mengganti lampu lama dengan lampu baru karena konsumsi listriknya tinggi.","Sebuah toko memindahkan rak barang karena pelanggan kesulitan menemukan produk tertentu.","Sekolah menyediakan ruang kosong untuk kegiatan siswa, lalu siswa menyusun aturan agar ruang tersebut tetap terawat."],[0,1,4],"Peristiwa A, B, dan E memiliki pola yang sama dengan teks: suatu ruang atau fasilitas yang digunakan bersama kemudian mendorong munculnya kepedulian dan tanggung jawab bersama. Pilihan C dan D memang menunjukkan perubahan tindakan, tetapi tidak berkaitan dengan pengelolaan ruang bersama atau tumbuhnya kepedulian komunitas."),
pg("data","Pernyataan yang paling sesuai dengan informasi dalam teks adalah ....",["Data sensor tidak dapat digunakan karena hasil pengukurannya selalu dipengaruhi kondisi cuaca.","Informasi mengenai lokasi dan waktu pengukuran tidak diperlukan selama angka hasil pengukuran tersedia.","Data sensor hanya dapat dipercaya apabila seluruh wilayah kota dipasangi sensor.","Pemerintah kota menampilkan data kepada masyarakat tanpa mempertimbangkan keterbatasan alat.","Data sensor dapat memberikan informasi mengenai kualitas udara, tetapi penggunaannya untuk menarik kesimpulan perlu mempertimbangkan konteks pengukuran."],4,"Data sensor tetap bermanfaat, tetapi teks menegaskan bahwa hasilnya perlu dipahami bersama lokasi, waktu, cuaca, dan kondisi teknis. Karena itu, B paling sesuai dengan isi teks."),
pg("data","Seorang pembaca menyimpulkan, “Karena pemerintah menampilkan data kualitas udara secara berkala, masyarakat sudah dapat memastikan kondisi udara seluruh kota setiap saat.”\nPenilaian yang paling tepat adalah ....",["tepat karena data yang diperbarui secara berkala selalu menggambarkan seluruh kondisi kota","kurang tepat karena cakupan dan kondisi pengukuran sensor perlu dipertimbangkan sebelum data digunakan untuk menggambarkan kondisi seluruh kota","tepat karena sensor menghasilkan data yang lebih objektif daripada pengamatan manusia","kurang tepat karena masyarakat seharusnya tidak diberikan akses terhadap data kualitas udara","tepat karena pemerintah telah menjamin bahwa seluruh sensor bekerja tanpa gangguan"],1,"Kesimpulan tersebut terlalu luas. Sensor hanya dipasang di titik tertentu dan hasil pengukuran dapat dipengaruhi berbagai kondisi. Jadi, data itu belum cukup untuk memastikan kondisi seluruh kota setiap saat."),
bs("data","Berdasarkan teks “Ketika Data Kota Tidak Berhenti di Angka”, tentukan apakah penilaian berikut Benar atau Salah.",["Data sensor tetap bermanfaat meskipun memiliki keterbatasan dalam menggambarkan kondisi seluruh kota.","Keterangan mengenai lokasi dan waktu pengukuran dapat membantu masyarakat memahami konteks data.","Karena terdapat kemungkinan gangguan teknis, seluruh data sensor sebaiknya diabaikan.","Data yang ditampilkan kepada publik sebaiknya dipahami tanpa memerlukan informasi pendukung agar masyarakat tidak bingung."],[1,1,0,0],"Teks menekankan bahwa data sensor tetap berguna, tetapi harus dibaca dengan memperhatikan keterbatasan dan konteksnya. Informasi tentang lokasi, waktu, dan gangguan teknis justru membantu pembaca memahami data secara lebih tepat. Jadi, adanya keterbatasan bukan berarti seluruh data harus diabaikan."),
pg("peta","Makna kata “representatif” pada paragraf kedua yang paling tepat adalah ....",["dibuat secara khusus oleh pemerintah untuk memenuhi kebutuhan masyarakat","memiliki tampilan yang lebih menarik dibandingkan peta konvensional","mampu menggambarkan keadaan berdasarkan pengalaman warga secara cukup mewakili","memuat informasi sebanyak mungkin tanpa melalui proses pemeriksaan","digunakan secara luas oleh masyarakat dari berbagai daerah"],2,"Dalam konteks teks, representatif berkaitan dengan kemampuan peta untuk mewakili atau menggambarkan keadaan yang dialami warga. Hal ini didukung oleh informasi bahwa data berasal dari pengalaman masyarakat yang menggunakan fasilitas secara langsung. Jadi, jawabannya C.\nPilihan A membahas tampilan, B tentang pembuat peta, D justru bertentangan dengan proses verifikasi, sedangkan E membahas luas penggunaan."),
bs("peta","Perhatikan kalimat-kalimat berikut yang berkaitan dengan teks “Peta yang Dibuat dari Suara Warga”.",["Data dari masyarakat diverifikasi terlebih dahulu sebelum informasi tersebut ditampilkan kepada publik.","Peta tersebut dianggap representatif dikarenakan karena informasi diperoleh dari pengalaman warga.","Relawan memeriksa laporan warga agar informasi yang belum terverifikasi tidak langsung ditampilkan.","Informasi dikumpulkan oleh masyarakat yang kemudian diverifikasi oleh relawan-relawan."],[1,0,1,0],"(1) Benar. Kalimat efektif dan maknanya sesuai dengan teks: informasi diperiksa sebelum dipublikasikan.\n(2) Salah. Frasa “dikarenakan karena” menggunakan dua penanda sebab sekaligus. Cukup gunakan “karena” atau “dikarenakan”.\n(3) Benar. Hubungan tujuan dalam kalimat jelas dan tidak berlebihan.\n(4) Salah. Bentuk “relawan-relawan” tidak diperlukan karena kata relawan sudah dapat menunjukkan pelaku secara umum. Kalimat dapat dibuat lebih efektif menjadi “Informasi dikumpulkan oleh masyarakat yang kemudian diverifikasi oleh relawan.”",1),
pg("rong","Penggambaran suasana dalam kutipan tersebut paling kuat berfungsi untuk ....",["membangun suasana sepi sekaligus memperkuat gambaran kehidupan pedesaan yang menjadi latar cerita","menunjukkan bahwa kehidupan masyarakat Dukuh Paruk sepenuhnya telah berhenti","menjelaskan konflik utama yang dialami tokoh utama secara langsung","menunjukkan bahwa masyarakat Dukuh Paruk tidak memiliki kegiatan sosial","menggambarkan perubahan cuaca yang menjadi penyebab masyarakat meninggalkan aktivitasnya"],0,"Kutipan banyak menghadirkan tanda-tanda kesunyian, seperti anak-anak yang sudah pulang dan suara lesung yang berhenti. Penggambaran tersebut membangun suasana sekaligus memperlihatkan kehidupan Dukuh Paruk sebagai lingkungan pedesaan. Jadi, B paling tepat.\nPilihan B dan D terlalu mutlak karena teks hanya menggambarkan keadaan pada waktu tertentu. C tidak tepat karena konflik tokoh tidak dijelaskan secara langsung. E juga tidak didukung oleh kutipan."),
pk("dara","Berdasarkan teks tersebut, pilihlah semua pernyataan yang tepat!",["Bagian “suara mesin perahu mulai terdengar dari sungai” tepat digunakan untuk menunjukkan bahwa Dara merupakan tokoh yang memiliki hubungan dekat dengan masyarakat nelayan di daerah tersebut.","Bagian “Ia tidak menunggu teman-temannya datang” tepat digunakan untuk memperkuat karakter Dara sebagai tokoh yang memiliki inisiatif dan tidak bergantung pada orang lain.","Bagian “Tangannya beberapa kali terkena lumpur, tetapi ia hanya mengusapnya pada celana lalu melanjutkan pekerjaan” tepat menggambarkan karakter Dara yang bersedia menghadapi kesulitan demi menyelesaikan tindakan yang dianggapnya penting.","Bagian “Dari sana, ia melihat air sungai mengalir lebih lancar meskipun masih keruh” tepat menggambarkan latar tempat sekaligus memperlihatkan perubahan keadaan sungai setelah kegiatan dilakukan.","Pernyataan Dara, “Belum bersih ... tetapi setidaknya hari ini kita tidak membiarkannya semakin buruk”, tepat digunakan untuk menunjukkan bahwa Dara menganggap masalah lingkungan telah selesai setelah kegiatan tersebut."],[1,2,3],"B. Tepat.\nKalimat tersebut menunjukkan bahwa Dara memiliki inisiatif. Ia mulai membersihkan sungai tanpa menunggu orang lain datang membantu.\nC. Tepat.\nTindakan Dara yang tetap bekerja meskipun tangannya terkena lumpur menunjukkan karakter tekun dan tidak mudah menyerah ketika menghadapi kesulitan.\nA. Kurang tepat.\nSuara mesin perahu memang membantu menggambarkan suasana lingkungan sungai, tetapi tidak cukup menjadi bukti bahwa Dara memiliki hubungan dekat dengan masyarakat nelayan.\nD. Tepat.\nBagian tersebut menggambarkan latar tempat, yaitu sungai dan jembatan kayu, sekaligus menunjukkan perubahan kondisi sungai setelah dibersihkan. Air memang belum sepenuhnya bersih, tetapi alirannya menjadi lebih lancar.\nE. Kurang tepat.\nJustru kalimat Dara menunjukkan bahwa ia menyadari masalah belum selesai. Ia hanya menilai kegiatan hari itu sebagai langkah awal agar kondisi sungai tidak semakin buruk."),
pg("puisi","Kekuatan penggalan puisi tersebut dalam membangun suasana terutama terlihat melalui ....",["penggunaan gambaran pelabuhan yang ramai sehingga menunjukkan kehidupan masyarakat pesisir","penggunaan latar pelabuhan untuk menunjukkan keberhasilan tokoh memperoleh cinta","penggunaan kata-kata konkret untuk menjelaskan aktivitas perdagangan di pelabuhan","penggunaan berbagai objek pelabuhan yang menghadirkan suasana sepi dan kesan kehilangan","penggunaan benda-benda pelabuhan untuk menggambarkan perjalanan tokoh menuju tempat baru"],3,"Penyebutan gudang, rumah tua, tiang, dan temali menghadirkan gambaran pelabuhan, tetapi suasananya bukan ramai. Ditambah pernyataan “tidak ada yang mencari cinta”, benda-benda tersebut justru memperkuat kesan sunyi, kosong, dan kehilangan.\nJadi, kekuatan kutipan terletak pada penggunaan objek konkret untuk membangun suasana batin yang sepi."),
pk("puisi","Berdasarkan kutipan tersebut, pernyataan yang menunjukkan apresiasi yang sesuai terhadap cara penyair membangun makna adalah ....\nPilih semua jawaban yang benar!",["Penyebutan benda-benda seperti gudang, rumah tua, tiang, dan temali membantu membangun gambaran konkret tentang latar pelabuhan.","Penggambaran pelabuhan menunjukkan bahwa penyair terutama ingin menjelaskan kehidupan ekonomi masyarakat di sekitar pelabuhan.","Kata “tidak ada” memperkuat kesan ketiadaan atau kekosongan yang menjadi bagian dari suasana puisi.","Penggunaan objek-objek pelabuhan membuat puisi hanya dapat dimaknai secara harfiah sebagai cerita tentang perjalanan di pelabuhan.","Hubungan antara latar pelabuhan dan ungkapan tentang cinta memungkinkan pembaca menangkap adanya kesan kesepian atau kehilangan."],[0,2,4],"A benar. Benda-benda yang disebutkan membuat latar pelabuhan terasa konkret dan mudah dibayangkan.\nC benar. Ungkapan “tidak ada” menonjolkan keadaan kosong sehingga mendukung suasana kesepian.\nB salah. Pelabuhan memang menjadi latar, tetapi puisi tidak berfokus pada kehidupan ekonomi masyarakat.\nE benar. Latar pelabuhan dipadukan dengan persoalan cinta sehingga muncul kesan emosional berupa kesepian dan kehilangan.\nD salah. Bahasa puisi tidak harus dimaknai secara harfiah. Hubungan antarkata dan suasana memungkinkan adanya makna yang lebih dalam.")
];

const KEY="dede-tka-bahasa-indonesia-v1",L="ABCDE";
const JN={pg:"Pilihan Ganda",pk:"Pilihan Ganda Kompleks",bs:"Benar / Salah"};
const HT={pg:"Pilih satu jawaban yang paling tepat.",pk:"Pilih semua jawaban yang tepat. Boleh lebih dari satu.",bs:"Tentukan Benar atau Salah untuk setiap pernyataan."};
const ROM=["I","II","III","IV"];
let S={ans:{},idx:0,done:false,res:null,best:null},view="home";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nl=s=>esc(s).replace(/\n/g,"<br>");
const paras=s=>s.split("\n").map(x=>`<p>${esc(x)}</p>`).join("");
function isDone(i){const q=Q[i],a=S.ans[i];if(q.t=="pg")return typeof a=="number";if(q.t=="pk")return Array.isArray(a)&&a.length>0;return Array.isArray(a)&&q.o.every((_,j)=>a[j]===0||a[j]===1)}
function isRight(i){const q=Q[i],a=S.ans[i];if(!isDone(i))return false;if(q.t=="pg")return a===q.k;if(q.t=="pk")return a.slice().sort().join()==q.k.slice().sort().join();return q.k.every((v,j)=>a[j]===v)}
const nDone=()=>Q.reduce((n,_,i)=>n+(isDone(i)?1:0),0);
function key(i){const q=Q[i];return q.t=="pg"?L[q.k]:q.t=="pk"?q.k.map(j=>L[j]).join(", "):q.k.map(v=>v?"Benar":"Salah").join(", ")}
function pass(q){const P=PS[q.p];return (P.t?`<h3>${esc(P.t)}</h3>`:"")+P.p.map(x=>`<p>${esc(x)}</p>`).join("")+(P.v?`<p class="poem">${P.v.map(esc).join("<br>")}</p>`:"")+(P.n?`<p class="nt">${esc(P.n)}</p>`:"")}
function qBody(i,rev){const q=Q[i],a=S.ans[i];let h=`<div class="q">${paras(q.q)}<p class="hint">${HT[q.t]}</p>`;
if(q.t=="bs"){h+=`<table class="bs"><tr><th></th><th>Benar</th><th>Salah</th></tr>`+q.o.map((t,j)=>{const c=rev?(a&&a[j]===q.k[j]?"ok":"no"):"";const lb=q.r?ROM[j]:j+1;return `<tr class="${c}"><td>${lb}. ${esc(t)}${rev?`<div class="mini">Kunci: ${q.k[j]?"Benar":"Salah"}</div>`:""}</td>`+[1,0].map(v=>`<td class="c"><input type="radio" name="r${j}" data-j="${j}" value="${v}" ${a&&a[j]===v?"checked":""} ${rev?"disabled":""} aria-label="${v?"Benar":"Salah"} untuk pernyataan ${lb}"></td>`).join("")+`</tr>`}).join("")+`</table>`}
else h+=q.o.map((t,j)=>{const on=q.t=="pg"?a===j:Array.isArray(a)&&a.includes(j);const ok=q.t=="pg"?q.k===j:q.k.includes(j);const c="opt"+(on?" on":"")+(rev?(ok?" ok":on?" no":""):"");return `<label class="${c}"><input type="${q.t=="pg"?"radio":"checkbox"}" name="q" value="${j}" ${on?"checked":""} ${rev?"disabled":""}><b>${L[j]}</b><span>${nl(t)}</span></label>`}).join("");
return h+`</div>`}
function home(){const n=nDone(),p=Math.round(n/Q.length*100);
const hearts=[8,22,36,50,64,78,90].map((l,k)=>`<span class="h" style="left:${l}%;animation-delay:${k*1.3}s">🤍</span>`).join("");
return `<section class="hero">${hearts}<h1>semangat yaa dede sayang belajarnya abang tau dede pasti bisa dapat nilai yang terbaikkkk. semangat sayangg🤍</h1></section>
<div class="card"><div class="sts"><div><b>${S.res?S.res.nilai:"–"}</b><span>Nilai terakhir</span></div><div><b>${S.best!==null?S.best:"–"}</b><span>Nilai terbaik</span></div><div><b>${n}/${Q.length}</b><span>Soal terjawab</span></div></div>
<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
<div class="acts"><button class="pri" data-a="start">${S.done?"Kerjakan lagi dari awal":n?"Lanjutkan belajar (soal "+(S.idx+1)+")":"Mulai belajar"}</button>${S.done?`<button data-a="res">Lihat nilai dan pembahasan</button>`:""}${!S.done&&n?`<button data-a="reset">Hapus jawaban</button>`:""}</div>
<p class="sv">TKA Bahasa Indonesia · ${Q.length} soal · Progres tersimpan otomatis di perangkat ini</p></div>`}
function quiz(){const i=S.idx,q=Q[i],n=nDone();
return `<div class="top"><button data-a="home">← Beranda</button><span>Soal ${i+1} dari ${Q.length}</span></div>
<div class="bar"><i style="width:${n/Q.length*100}%"></i></div>
<div class="grid">${Q.map((_,k)=>`<button data-a="jump" data-i="${k}" class="${k==i?"cur":isDone(k)?"dn":""}" aria-label="Soal ${k+1}${isDone(k)?", sudah dijawab":""}">${k+1}</button>`).join("")}</div>
<div class="card"><div class="tags"><span class="tag">${JN[q.t]}</span><span class="tag s">Materi: Bahasa Indonesia</span></div><div class="pass">${pass(q)}</div>${qBody(i,false)}</div>
<div class="nav"><button data-a="prev" ${i?"":"disabled"}>← Sebelumnya</button>${i<Q.length-1?`<button class="pri" data-a="next">Berikutnya →</button>`:`<button class="pri" data-a="fin">Selesai dan lihat nilai</button>`}</div>
<p class="sv">Terjawab ${n} dari ${Q.length} · Jawabanmu tersimpan otomatis 🤍 · <a href="#" data-a="fin" style="color:var(--rose2)">Selesai sekarang</a></p>`}
function result(){const r=S.res||{benar:0,nilai:0};
return `<div class="top"><button data-a="home">← Beranda</button><span>Hasil latihan</span></div>
<div class="card score"><p class="ser" style="margin:0;color:var(--mut)">Nilaimu</p><div class="n">${r.nilai}</div><p style="margin:6px 0 0">Benar ${r.benar} dari ${Q.length} soal · Salah ${Q.length-r.benar}</p><p class="mini">Soal Pilihan Ganda Kompleks dan Benar / Salah dinilai benar jika semua pilihannya tepat.</p><p class="ser" style="margin:12px 0 0;color:var(--rose2)">semangat terus ya sayang 🤍</p>
<div class="acts" style="justify-content:center"><button class="pri" data-a="start" style="flex:0 1 auto">Kerjakan lagi</button></div></div>
<div class="rv">${Q.map((q,i)=>{const ok=isRight(i);return `<div class="card"><div class="tags"><span class="tag">${JN[q.t]}</span><span class="tag s">Materi: Bahasa Indonesia</span></div><h2>Nomor ${i+1}. ${isDone(i)?(ok?"Benar ✓":"Salah ✗"):"Belum dijawab"}</h2><details><summary>Lihat teks soal</summary><div class="pass">${pass(q)}</div></details>${qBody(i,true)}<div class="pem ${ok?"":"x"}"><p><b>Jawaban: ${key(i)}</b></p><p><b>Pembahasan:</b></p>${paras(q.x)}</div></div>`}).join("")}</div>`}
function render(){$("#app").innerHTML=view=="home"?home():view=="quiz"?quiz():result()}
function go(v){view=v;render();window.scrollTo(0,0)}
function finish(){const un=Q.length-nDone();if(un&&!confirm(`Masih ada ${un} soal belum dijawab. Tetap selesai dan lihat nilai?`))return;const b=Q.reduce((n,_,i)=>n+(isRight(i)?1:0),0),nilai=Math.round(b/Q.length*100);S.done=true;S.res={benar:b,nilai};if(S.best===null||nilai>S.best)S.best=nilai;save();go("result")}
function fresh(){S.ans={};S.idx=0;S.done=false;save();go("quiz")}
$("#app").addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;e.preventDefault();const a=t.dataset.a;
if(a=="home")go("home");
else if(a=="start"){if(S.done){if(confirm("Mulai lagi dari awal? Jawaban sebelumnya dihapus, nilai terakhir dan nilai terbaik tetap tersimpan."))fresh()}else go("quiz")}
else if(a=="res")go("result");
else if(a=="reset"){if(confirm("Hapus semua jawaban yang sudah tersimpan?")){S.ans={};S.idx=0;save();render()}}
else if(a=="jump"){S.idx=+t.dataset.i;save();render();window.scrollTo(0,0)}
else if(a=="prev"&&S.idx>0){S.idx--;save();render();window.scrollTo(0,0)}
else if(a=="next"&&S.idx<Q.length-1){S.idx++;save();render();window.scrollTo(0,0)}
else if(a=="fin")finish()});
$("#app").addEventListener("change",e=>{if(view!="quiz"||e.target.tagName!="INPUT")return;const i=S.idx,q=Q[i],v=e.target;
if(q.t=="pg")S.ans[i]=+v.value;
else if(q.t=="pk"){const s=new Set(S.ans[i]||[]);v.checked?s.add(+v.value):s.delete(+v.value);S.ans[i]=[...s].sort()}
else{const a=Array.isArray(S.ans[i])?S.ans[i].slice():q.o.map(()=>null);a[+v.dataset.j]=+v.value;S.ans[i]=a}
save();const y=window.scrollY;render();window.scrollTo(0,y)});
render();
</script>
</body>
</html>
